apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-deployment
  labels:
    name: sandbox-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: sandbox
    spec:
      containers:
        - image: sandbox:latest
          name: main-sandbox-container
          resources:
            limits:
              cpu: "500m"
              memory: "400Mi"
            requests:
              cpu: "250m"
              memory: "200Mi"
          livenessProbe: #basically checks if the container is alive and running, if not it will restart the container
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 90
            timeoutSeconds: 10
          readinessProbe: #basically checks if the container is ready to accept traffic, if not it will not send traffic to the container
            httpGet:
              path: /api/sandbox/health
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 10
          ports:
            - containerPort: 3000
              name: main-sandbox
